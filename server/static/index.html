<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Архив записей</title>
  <style>
    :root { color-scheme: light; --bg:#f4f5f7; --card:#fff; --text:#1a1a1a; --muted:#667085; --accent:#2563eb; --line:#e4e7ec; --danger:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.45 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); -webkit-tap-highlight-color: transparent; }
    header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    main { display:grid; grid-template-columns: 300px 1fr; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
    .muted { color:var(--muted); }
    input, button, select { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:#fff; min-height:40px; }
    button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
    button.secondary { background:#fff; color:var(--text); border-color:var(--line); }
    button.danger { background:#fff; color:var(--danger); border-color:#fecdca; }
    button.danger:hover { background:#fef3f2; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    ul { list-style:none; margin:0; padding:0; }
    li.pc { padding:10px 8px; border-radius:8px; display:flex; gap:8px; align-items:center; }
    li.pc .body { flex:1; cursor:pointer; min-width:0; }
    li.pc:hover, li.pc.active { background:#eef4ff; }
    li.pc .icon-btn { flex:0 0 auto; width:36px; height:36px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:#fff; color:var(--muted); border:1px solid var(--line); border-radius:8px; font-size:14px; line-height:1; }
    li.pc .icon-btn:hover { color:var(--text); border-color:#b0b8c4; }
    li.pc .icon-btn.trash:hover { color:var(--danger); border-color:#fecdca; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:middle; }
    th.chk, td.chk { width:40px; }
    video { width:100%; max-height:min(420px, 55vh); background:#000; border-radius:8px; }
    #login { max-width:360px; margin:80px auto; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center; }
    .filters { display:grid; grid-template-columns: 1fr auto auto auto; gap:8px; margin-bottom:10px; align-items:center; }
    .err { color:var(--danger); }
    .empty { padding:16px; color:var(--muted); }
    a.dl { color:var(--accent); }
    .actions { display:flex; gap:12px; flex-wrap:nowrap; align-items:center; justify-content:flex-end; }
    .actions button { padding:8px 12px; font-size:14px; min-width:42px; min-height:40px; }
    .storage { display:flex; align-items:center; gap:8px; margin-left:auto; min-width:150px; max-width:260px; }
    .storage .meta { font-size:11px; color:var(--muted); white-space:nowrap; }
    .storage .bar { flex:1; height:6px; background:#eef0f4; border-radius:99px; overflow:hidden; min-width:48px; }
    .storage .bar > i { display:block; height:100%; background:#98a2b3; border-radius:99px; }
    .storage .bar.high > i { background:#f79009; }
    .storage .bar.crit > i { background:#f04438; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .rec-cards { display:none; }
    .rec-card { border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
    .rec-card .top { display:flex; gap:10px; align-items:flex-start; margin-bottom:8px; }
    .rec-card .meta-line { font-size:14px; color:var(--muted); margin-top:2px; word-break:break-word; }
    .rec-card .title { font-weight:600; font-size:14px; word-break:break-word; }
    .rec-card .actions { justify-content:stretch; margin-top:10px; }
    .rec-card .actions button { flex:1; }

    @media (max-width:900px) {
      main { grid-template-columns:1fr; gap:12px; padding:10px; padding-bottom:24px; }
      header { padding:10px 12px; gap:8px; }
      header h1 { font-size:15px; width:100%; }
      .storage { margin-left:0; order:3; width:100%; max-width:none; min-width:0; }
      .storage .meta { font-size:12px; white-space:normal; }
      #logout { margin-left:auto; }
      .filters { grid-template-columns:1fr 1fr; }
      .filters #q { grid-column:1 / -1; }
      .filters #reload { grid-column:1 / -1; }
      .toolbar { font-size:14px; }
      .toolbar button { flex:1 1 calc(50% - 8px); font-size:14px; }
      #pcs { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scroll-snap-type:x mandatory; }
      li.pc { flex:0 0 auto; min-width:200px; max-width:260px; border:1px solid var(--line); scroll-snap-align:start; background:#fafafa; font-size:14px; }
      li.pc strong { font-size:14px; font-weight:600; }
      li.pc .muted { font-size:13px; }
      li.pc.active { border-color:#93c5fd; background:#eef4ff; }
      .desk-table { display:none; }
      .rec-cards { display:block; font-size:14px; }
      .rec-card { padding:10px; }
      .rec-card .title { font-size:14px; font-weight:500; }
      .rec-card .meta-line { font-size:13px; }
      #playerMeta { font-size:13px; }
      .actions { gap:14px; }
      .actions button { font-size:13px; min-height:38px; }
      #playerWrap .row { flex-direction:column; align-items:stretch; }
      #playerWrap .row > * { width:100%; text-align:center; font-size:14px; }
      a.dl { display:inline-block; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
      .empty, #selCount { font-size:14px; }
    }
    @media (max-width:420px) {
      .toolbar button { flex:1 1 100%; }
      .actions { gap:16px; }
    }
  </style>
</head>
<body>
  <div id="login" class="card" hidden>
    <h1>Вход администратора</h1>
    <p class="muted">Пароль администратора из настройки сервера архива (не токен агента).</p>
    <div class="row"><input id="password" type="password" placeholder="Пароль" style="flex:1" /></div>
    <button id="loginBtn">Войти</button>
    <p id="loginErr" class="err"></p>
  </div>

  <div id="app" hidden>
    <header>
      <h1>Архив записей экрана</h1>
      <span class="muted" id="who"></span>
      <div class="storage" id="storageWrap" title="Место на диске архива">
        <div class="bar" id="storageBar"><i id="storageFill" style="width:0%"></i></div>
        <span class="meta" id="storageMeta">…</span>
      </div>
      <button class="secondary" id="logout">Выйти</button>
    </header>
    <main>
      <section class="card" id="pcsCard">
        <ul id="pcs"></ul>
      </section>
      <section class="card">
        <div class="filters">
          <input id="q" placeholder="Поиск по имени / файлу" />
          <input id="from" type="date" title="Дата с" />
          <input id="to" type="date" title="Дата по" />
          <button id="reload">Обновить</button>
        </div>
        <div class="toolbar">
          <button class="secondary" id="selAll" type="button">Выбрать все</button>
          <button class="secondary" id="selNone" type="button">Снять</button>
          <button class="secondary" id="dlSelected" type="button" disabled>Скачать выбранные</button>
          <button class="danger" id="delSelected" type="button" disabled>Удалить выбранные</button>
          <span class="muted" id="selCount"></span>
        </div>
        <div id="playerWrap" hidden>
          <video id="player" controls preload="metadata" playsinline></video>
          <p class="muted" id="playerMeta"></p>
          <div class="row">
            <a class="dl" id="downloadLink" href="#" download>Скачать MP4</a>
            <button class="danger" id="deleteCurrent" type="button">Удалить эту запись</button>
          </div>
          <p class="err" id="playerErr"></p>
        </div>
        <div class="desk-table">
          <table>
            <thead>
              <tr>
                <th class="chk"><input type="checkbox" id="chkAll" title="Выбрать все" /></th>
                <th>Время</th><th>ПК</th><th>Файл</th><th>Размер</th><th></th>
              </tr>
            </thead>
            <tbody id="recs"></tbody>
          </table>
        </div>
        <div class="rec-cards" id="recCards"></div>
        <p id="recsEmpty" class="empty" hidden>Нет записей по выбранным фильтрам.</p>
      </section>
    </main>
  </div>

<script>
const state = {
  token: localStorage.getItem('hsr_admin') || '',
  pc: '',
  currentId: null,
  rows: [],
  /** @type {Set<number>} single source of truth — table + cards stay in sync */
  selected: new Set(),
};

async function api(path, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { state.token=''; localStorage.removeItem('hsr_admin'); showLogin(); throw new Error('unauthorized'); }
  return res;
}

function showLogin(){ login.hidden=false; app.hidden=true; }
function showApp(){ login.hidden=true; app.hidden=false; loadStorage(); loadPcs(); loadRecs(); }

loginBtn.onclick = async () => {
  loginErr.textContent='';
  const res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: password.value }) });
  if (!res.ok) { loginErr.textContent='Неверный пароль администратора (это не токен агента)'; return; }
  const data = await res.json();
  state.token = data.token; localStorage.setItem('hsr_admin', state.token); showApp();
};
password.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
logout.onclick = () => { state.token=''; localStorage.removeItem('hsr_admin'); showLogin(); };
reload.onclick = () => { loadStorage(); loadPcs(); loadRecs(); };
q.onchange = from.onchange = to.onchange = () => loadRecs();

player.addEventListener('error', () => {
  playerErr.textContent = 'Не удалось воспроизвести файл. Скачайте и откройте в VLC / Edge с кодеком HEVC.';
});
player.addEventListener('loadeddata', () => { playerErr.textContent = ''; });

async function loadStorage(){
  try {
    const res = await api('/api/storage');
    if (!res.ok) return;
    const s = await res.json();
    const used = s.used_bytes || 0;
    const free = s.free_bytes || 0;
    const total = s.total_bytes || (used + free) || 1;
    const pct = Math.min(100, Math.round((used / total) * 100));
    storageFill.style.width = pct + '%';
    storageBar.className = 'bar' + (pct >= 92 ? ' crit' : pct >= 80 ? ' high' : '');
    storageMeta.textContent = 'занято ' + fmtBytes(used) + ' · свободно ' + fmtBytes(free);
  } catch (_) {}
}

async function loadPcs(){
  const res = await api('/api/computers');
  const list = await res.json();
  pcs.innerHTML = '';
  const all = document.createElement('li');
  all.className = 'pc' + (state.pc ? '' : ' active');
  all.innerHTML = `<div class="body"><strong>Все рабочие места</strong></div>`;
  all.querySelector('.body').onclick = () => { state.pc=''; [...pcs.children].forEach(c=>c.classList.remove('active')); all.classList.add('active'); loadRecs(); };
  pcs.appendChild(all);
  for (const c of list) {
    const li = document.createElement('li');
    li.className = 'pc' + (state.pc === c.pc_id ? ' active' : '');
    li.innerHTML = `
      <div class="body">
        <div><strong>${escapeHtml(c.display_name)}</strong></div>
        <div class="muted">${escapeHtml(c.pc_id)} · ${c.recording_count} · ${fmtBytes(c.total_bytes)}</div>
      </div>
      <button type="button" class="icon-btn edit" title="Переименовать">✎</button>
      <button type="button" class="icon-btn trash" title="Удалить весь архив этого места">🗑</button>`;
    li.querySelector('.body').onclick = () => {
      state.pc = c.pc_id;
      [...pcs.children].forEach(x => x.classList.remove('active'));
      li.classList.add('active');
      loadRecs();
    };
    li.querySelector('.edit').onclick = async (e) => {
      e.stopPropagation();
      const name = prompt('Отображаемое имя рабочего места', c.display_name);
      if (!name || !name.trim()) return;
      const res = await api('/api/computers/' + encodeURIComponent(c.pc_id), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ display_name: name.trim() })
      });
      if (!res.ok) { alert('Не удалось переименовать'); return; }
      loadPcs(); loadRecs();
    };
    li.querySelector('.trash').onclick = async (e) => {
      e.stopPropagation();
      const ok = prompt(
        'Удаление всего архива рабочего места «' + c.display_name + '» (' + c.pc_id + ').\n' +
        'Будет удалено записей: ' + c.recording_count + '.\n\n' +
        'Для подтверждения введите: Удаление'
      );
      if (ok !== 'Удаление') return;
      const res = await api('/api/computers/' + encodeURIComponent(c.pc_id), { method: 'DELETE' });
      if (!res.ok) { alert('Не удалось удалить архив'); return; }
      if (state.pc === c.pc_id) state.pc = '';
      playerWrap.hidden = true;
      state.currentId = null;
      state.selected.clear();
      await refreshAfterMutation();
    };
    pcs.appendChild(li);
  }
}

function actionButtonsHtml() {
  return `<div class="actions">
    <button type="button" data-act="play" title="Смотреть">▶</button>
    <button type="button" class="secondary" data-act="dl" title="Скачать">⬇</button>
    <button type="button" class="danger" data-act="del" title="Удалить">🗑</button>
  </div>`;
}

function bindRowActions(root, r) {
  root.querySelector('[data-act="play"]').onclick = () => play(r);
  root.querySelector('[data-act="dl"]').onclick = () => downloadOne(r);
  root.querySelector('[data-act="del"]').onclick = () => deleteOne(r);
}

async function loadRecs(){
  const params = new URLSearchParams();
  if (state.pc) params.set('pc_id', state.pc);
  if (q.value.trim()) params.set('q', q.value.trim());
  if (from.value) params.set('from', from.value + 'T00:00:00Z');
  if (to.value) params.set('to', to.value + 'T23:59:59Z');
  const res = await api('/api/recordings?' + params.toString());
  if (!res.ok) {
    recsEmpty.hidden = false;
    recsEmpty.textContent = 'Не удалось загрузить список записей.';
    return;
  }
  const list = await res.json();
  if (!Array.isArray(list)) {
    recsEmpty.hidden = false;
    recsEmpty.textContent = 'Некорректный ответ сервера.';
    return;
  }
  state.rows = list;
  // Drop selection for rows that are no longer in the current list.
  const visible = new Set(list.map((r) => Number(r.id)));
  for (const id of [...state.selected]) {
    if (!visible.has(id)) state.selected.delete(id);
  }
  recs.innerHTML = '';
  recCards.innerHTML = '';
  recsEmpty.hidden = list.length > 0;
  if (list.length === 0) recsEmpty.textContent = 'Нет записей по выбранным фильтрам.';
  for (const r of list) {
    const id = Number(r.id);
    const tr = document.createElement('tr');
    tr.dataset.id = String(id);
    tr.innerHTML = `
      <td class="chk"><input type="checkbox" class="rowchk" data-id="${id}" /></td>
      <td>${escapeHtml(formatRecordedAt(r.recorded_at))}</td>
      <td>${escapeHtml(r.display_name)}</td>
      <td>${escapeHtml(r.file_name)}</td>
      <td>${fmtBytes(r.size_bytes)}</td>
      <td>${actionButtonsHtml()}</td>`;
    bindRowActions(tr, r);
    tr.querySelector('.rowchk').onchange = (e) => setSelected(id, e.target.checked);
    recs.appendChild(tr);

    const card = document.createElement('div');
    card.className = 'rec-card';
    card.dataset.id = String(id);
    card.innerHTML = `
      <div class="top">
        <input type="checkbox" class="rowchk" data-id="${id}" />
        <div style="flex:1;min-width:0">
          <div class="title">${escapeHtml(r.file_name)}</div>
          <div class="meta-line">${escapeHtml(formatRecordedAt(r.recorded_at))} · ${escapeHtml(r.display_name)} · ${fmtBytes(r.size_bytes)}</div>
        </div>
      </div>
      ${actionButtonsHtml()}`;
    bindRowActions(card, r);
    card.querySelector('.rowchk').onchange = (e) => setSelected(id, e.target.checked);
    recCards.appendChild(card);
  }
  paintSelection();
}

function selectedIds() {
  return [...state.selected].map(Number).filter((id) => Number.isFinite(id));
}

function setSelected(id, checked) {
  id = Number(id);
  if (!Number.isFinite(id)) return;
  if (checked) state.selected.add(id);
  else state.selected.delete(id);
  paintSelection();
}

function selectAllVisible(on) {
  for (const r of state.rows) {
    const id = Number(r.id);
    if (on) state.selected.add(id);
    else state.selected.delete(id);
  }
  paintSelection();
}

function paintSelection() {
  document.querySelectorAll('.rowchk[data-id]').forEach((el) => {
    const id = Number(el.dataset.id);
    el.checked = state.selected.has(id);
  });
  const ids = selectedIds();
  selCount.textContent = ids.length ? ('Выбрано: ' + ids.length) : '';
  dlSelected.disabled = ids.length === 0;
  delSelected.disabled = ids.length === 0;
  const visibleIds = state.rows.map((r) => Number(r.id));
  chkAll.checked =
    visibleIds.length > 0 && visibleIds.every((id) => state.selected.has(id));
  chkAll.indeterminate =
    !chkAll.checked && visibleIds.some((id) => state.selected.has(id));
}

async function refreshAfterMutation() {
  await Promise.all([loadStorage(), loadPcs(), loadRecs()]);
}

chkAll.onchange = () => selectAllVisible(chkAll.checked);
selAll.onclick = () => selectAllVisible(true);
selNone.onclick = () => {
  state.selected.clear();
  paintSelection();
};

dlSelected.onclick = async () => {
  const ids = selectedIds();
  for (const id of ids) {
    const r = state.rows.find((x) => Number(x.id) === id);
    if (r) await downloadOne(r);
    await new Promise((resolve) => setTimeout(resolve, 250));
  }
};

delSelected.onclick = async () => {
  const ids = selectedIds();
  if (!ids.length) return;
  if (!confirm('Удалить выбранные записи (' + ids.length + ' шт.)?')) return;
  delSelected.disabled = true;
  try {
    const res = await api('/api/recordings/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids })
    });
    if (!res.ok) {
      alert('Не удалось удалить выбранные записи (HTTP ' + res.status + ')');
      return;
    }
    const data = await res.json().catch(() => ({}));
    const deletedIds = Array.isArray(data.deleted_ids)
      ? data.deleted_ids.map(Number)
      : ids;
    for (const id of deletedIds) state.selected.delete(id);
    if (state.currentId != null && deletedIds.includes(Number(state.currentId))) {
      playerWrap.hidden = true;
      state.currentId = null;
      player.removeAttribute('src');
      while (player.firstChild) player.removeChild(player.firstChild);
      player.load();
    }
    await refreshAfterMutation();
    const missing = Array.isArray(data.missing_ids) ? data.missing_ids.length : 0;
    if (missing > 0) {
      alert('Удалено: ' + (data.deleted || deletedIds.length) + '. Не найдено на сервере: ' + missing);
    }
  } catch (err) {
    alert('Ошибка удаления: ' + (err && err.message ? err.message : err));
  } finally {
    paintSelection();
  }
};

async function deleteOne(r) {
  if (!confirm('Удалить запись «' + r.file_name + '»?')) return;
  const id = Number(r.id);
  try {
    const res = await api('/api/recordings/' + id, { method: 'DELETE' });
    if (!res.ok) {
      alert('Не удалось удалить (HTTP ' + res.status + ')');
      return;
    }
    state.selected.delete(id);
    if (Number(state.currentId) === id) {
      playerWrap.hidden = true;
      state.currentId = null;
      player.removeAttribute('src');
      while (player.firstChild) player.removeChild(player.firstChild);
      player.load();
    }
    await refreshAfterMutation();
  } catch (err) {
    alert('Ошибка удаления: ' + (err && err.message ? err.message : err));
  }
}

deleteCurrent.onclick = () => {
  const r = state.rows.find(x => x.id === state.currentId);
  if (r) deleteOne(r);
};

function downloadOne(r) {
  const a = document.createElement('a');
  a.href = mediaUrl(r.id);
  a.download = r.file_name || 'recording.mp4';
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function formatRecordedAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) {
    return String(iso).replace('T', '   ').replace(/\.\d+/, '').replace(/([+-]\d{2}:\d{2}|Z)$/i, '');
  }
  const p = (n) => String(n).padStart(2, '0');
  return (
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    '   ' +
    p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds())
  );
}

function mediaUrl(id) {
  return '/api/media/' + id + '?access_token=' + encodeURIComponent(state.token);
}

function play(r){
  playerWrap.hidden = false;
  playerErr.textContent = '';
  state.currentId = r.id;
  downloadLink.href = mediaUrl(r.id);
  downloadLink.setAttribute('download', r.file_name || 'recording.mp4');
  if (r.ready === false) {
    player.removeAttribute('src');
    while (player.firstChild) player.removeChild(player.firstChild);
    player.load();
    playerMeta.textContent = r.display_name + ' · ' + r.file_name;
    playerErr.textContent = 'Файл ещё не готов к просмотру (загрузка не завершена).';
    return;
  }
  while (player.firstChild) player.removeChild(player.firstChild);
  const src = document.createElement('source');
  src.src = mediaUrl(r.id);
  src.type = 'video/mp4; codecs="hvc1.1.6.L120.B0"';
  player.appendChild(src);
  player.load();
  playerMeta.textContent = r.display_name + ' · ' + r.file_name + ' · ' + fmtBytes(r.size_bytes);
  player.play().catch(() => {
    playerErr.textContent = 'Автозапуск заблокирован. Нажмите Play или скачайте файл.';
  });
  playerWrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fmtBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

if (state.token) showApp(); else showLogin();
setInterval(() => { if (state.token) loadStorage(); }, 60000);
</script>
